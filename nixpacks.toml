[variables]
NIXPACKS_NODE_VERSION = "20"

[phases.install]
cmds = ["pnpm install --frozen-lockfile --prod=false"]

[phases.build]
cmds = [
  "pnpm --filter @quote-me/backend exec prisma generate",
  "pnpm build"
]

[start]
cmd = "pnpm --filter @quote-me/backend exec prisma migrate deploy && pnpm --filter @quote-me/backend prisma:seed && pnpm start"
